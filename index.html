<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrace uzavřena - Talentová soutěž</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    
    h1 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 28px;
    }
    
    .subtitle {
      color: #666;
      margin-bottom: 40px;
      font-size: 14px;
    }
    
    .icon {
      font-size: 80px;
      margin-bottom: 30px;
      animation: fadeIn 1s ease-in;
    }
    
    h2 {
      color: #667eea;
      font-size: 26px;
      margin-bottom: 20px;
      animation: fadeIn 1.2s ease-in;
    }
    
    p {
      color: #666;
      font-size: 16px;
      line-height: 1.8;
      margin-bottom: 15px;
      animation: fadeIn 1.4s ease-in;
    }
    
    .highlight {
      font-weight: 600;
      color: #667eea;
      margin-top: 30px;
      font-size: 17px;
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 30px 20px;
      }
      
      h1 {
        font-size: 24px;
      }
      
      .icon {
        font-size: 60px;
      }
      
      h2 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎭 Talentová soutěž</h1>
    <p class="subtitle">Registrační formulář pro diváky</p>
    
    <div class="icon">🔒</div>
    <h2>Registrace byla uzavřena</h2>
    <p>Děkujeme za váš zájem o Talentovou soutěž.</p>
    <p>Kapacita akce byla naplněna a registrace je uzavřena.</p>
    <p class="highlight">  </p>
  </div>
</body>
</html>
